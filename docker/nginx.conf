server {
    listen 80;
    listen [::]:80;

    # Cloudflare Tunnel reaches this container by service name, not hostname,
    # so there is nothing to match on — and no TLS here either: the tunnel
    # terminates HTTPS at Cloudflare's edge.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Hashed build assets ------------------------------------------------
    # Filenames under /_next/static/ contain a content hash, so a changed file
    # is a changed URL. Caching them for a year is safe and makes repeat visits
    # essentially free.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- Everything else ----------------------------------------------------
    # HTML must revalidate, otherwise a redeploy stays invisible to anyone who
    # has already visited until their cache expires.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # Static export writes /about.html rather than /about/index.html, so
        # $uri.html is what resolves a clean URL.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Block access to dotfiles if any ever end up in the web root.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
