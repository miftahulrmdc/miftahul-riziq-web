# Security headers.
#
# Kept in a snippet because nginx's `add_header` does NOT inherit into a
# location block that declares its own add_header — the parent's headers are
# silently dropped. Including this file in every location is the reliable fix.

# Stop the browser guessing a MIME type different from the one we send.
add_header X-Content-Type-Options "nosniff" always;

# Disallow framing entirely — nothing here is meant to be embedded.
add_header X-Frame-Options "DENY" always;

# Send the origin, not the full path, when following a link off-site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Explicitly decline hardware APIs the site never uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content-Security-Policy is deliberately left off by default.
#
# Next.js injects inline hydration scripts, so a policy tight enough to be
# worth having needs 'unsafe-inline' for script-src anyway — and a CSP that
# blocks the contact form is worse than none. Enable it only after testing the
# form end to end:
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
