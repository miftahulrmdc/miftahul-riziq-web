# Security headers.
#
# Kept in a snippet because nginx's `add_header` does NOT inherit into a
# location block that declares its own add_header — the parent's headers are
# silently dropped. Including this file in every location is the reliable fix.

# Stop the browser guessing a MIME type different from the one we send.
add_header X-Content-Type-Options "nosniff" always;

# Disallow framing entirely — nothing here is meant to be embedded.
add_header X-Frame-Options "DENY" always;

# Send the origin, not the full path, when following a link off-site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Explicitly decline hardware APIs the site never uses. Kept identical to the
# documentation site's policy — two sites with the same threat model differing
# in what they decline is a difference nobody decided on, and the next person
# comparing them has to work out whether it meant something.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Declare HSTS here rather than relying on the reverse proxy to add it.
#
# aaPanel writes its own `add_header Strict-Transport-Security` into the site
# config, so this header did arrive at visitors without this line — but only
# for as long as that panel setting stays as it is. A security header that
# depends on someone else's checkbox is not a policy, it is a coincidence.
#
# Sending it from here does mean two Strict-Transport-Security headers on the
# response while the panel also sends one. That is harmless: RFC 6797 has the
# browser process the first and ignore the rest, and nginx emits the proxied
# upstream's headers ahead of its own add_header — so this stronger policy,
# with includeSubDomains, is the one that takes effect.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy is deliberately left off by default.
#
# Next.js injects inline hydration scripts, so a policy tight enough to be
# worth having needs 'unsafe-inline' for script-src anyway — and a CSP that
# blocks the contact form is worse than none.
#
# The `connect-src` entry is the part that matters and the part most easily got
# wrong: the form posts to api.web3forms.com from the browser. Copying a policy
# from a site without a contact form drops that origin, and the failure is
# silent — the button does nothing, and the server logs stay clean because the
# request was never sent.
#
# Enabling it is a two-step process. Do not skip to the second.
#
# Step 1 — observe without enforcing. Report-Only changes nothing about what
# the browser permits; it only logs what *would* have been blocked to the
# console. Ship this, exercise every page and submit the contact form for real,
# and read the console:
#
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
#
# Step 2 — once the console reports nothing across a full pass, swap the header
# name to Content-Security-Policy and redeploy. Same policy, now enforced.
#
# A note on what this policy is not: 'unsafe-inline' on script-src is a real
# concession, and it is what a framework injecting inline hydration scripts
# costs. Removing it needs per-request nonces, which a static export cannot
# produce — that would mean giving up `output: export`. Worth writing down as a
# known limit rather than leaving it to look like an oversight.
