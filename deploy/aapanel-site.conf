# =============================================================================
#  aaPanel site config — reverse proxy to the Docker container
# =============================================================================
#
#  Architecture:
#
#    Internet → Cloudflare → cloudflared → nginx (aaPanel VM, :80)
#                                              └─ proxy_pass → 192.168.10.10:8080
#                                                                 └─ nginx in Docker
#
#  aaPanel is the single front door, so every site is visible and managed in the
#  panel — but the site itself stays a container, so its nginx config, caching
#  and security headers live in Git and rebuild identically anywhere.
#
#  HOW TO APPLY
#  Paste the blocks below into the site's Configuration File in aaPanel
#  (Website → site → Config), just before the closing `}`.
#
#  aaPanel owns that file and may rewrite parts of it when you change settings
#  in the panel, so this copy is the source of truth. If the panel ever wipes
#  your edits, paste them back from here.
#
#  Do NOT enable SSL on the aaPanel site: TLS terminates at Cloudflare, and a
#  forced HTTPS redirect here can produce a redirect loop.
#
#  Caching and security headers are deliberately NOT set here — the container
#  already sends them, and nginx passes upstream response headers through
#  untouched. Setting them in both places would only risk them disagreeing.
# =============================================================================


# --- Next.js assets ----------------------------------------------------------
# `^~` is load-bearing. aaPanel ships `location ~ .*\.(js|css)?$ { expires 12h; }`
# and a regex location beats a plain prefix in nginx. Without `^~`, every script
# and stylesheet would fall through to that block, which has no proxy_pass — so
# nginx would look for the file on local disk and return 404.
location ^~ /_next/ {
    proxy_pass http://192.168.10.10:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare terminates TLS, so the original scheme is always https.
    proxy_set_header X-Forwarded-Proto https;
    # Empty Connection header keeps the upstream connection alive.
    proxy_set_header Connection "";
    access_log off;
}


# --- Everything else ---------------------------------------------------------
location / {
    proxy_pass http://192.168.10.10:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
