# Portfolio container.
#
# cloudflared is NOT run here — it already runs on the aaPanel VM, so a second
# instance would be redundant. That VM reaches this container over the LAN, so
# the port below has to be published; the tunnel then routes to it.
#
#   Internet → Cloudflare → tunnel (aaPanel VM) → this VM:8080 → nginx:80
#
# Nothing is forwarded on the MikroTik: port 8080 is reachable from the LAN
# only, which is what the tunnel needs and no more.

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: miftahul-portfolio:latest
    container_name: portfolio
    restart: unless-stopped

    # host:container. Change the left number if 8080 is already taken on this
    # VM — then point the tunnel route at the new one.
    ports:
      - "8080:80"

    # Static files only; nothing needs to write to the image at runtime.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
